name: Deploy Swaraavali to GitHub Pages

# Builds the Next.js static export in /swaraavali and publishes it to
# GitHub Pages at https://vibhorxpandey.github.io/remindr/

on:
  push:
    branches: [master]
    paths:
      - "swaraavali/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swaraavali
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: swaraavali/package-lock.json

      # Enables Pages on first run (build_type: workflow) so no manual toggle.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "true"
          PAGES_BASE_PATH: /remindr
          NEXT_PUBLIC_SITE_URL: https://vibhorxpandey.github.io/remindr
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: swaraavali/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
